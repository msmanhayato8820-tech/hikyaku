<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>飛脚 — 日本橋から品川へ</title>
<style>
:root{color-scheme:light;--ink:#183e4a;--paper:#f2e6c9;--red:#b84330}*{box-sizing:border-box}body{margin:0;background:#172f36;color:var(--ink);font-family:serif}main{max-width:1100px;margin:auto;background:var(--paper);min-height:100dvh;padding:24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:16px}.eyebrow{font:12px sans-serif;letter-spacing:.2em}h1{font-size:46px;margin:0;letter-spacing:.18em}h1 small{font-size:15px;letter-spacing:.1em}button{font:700 16px sans-serif;background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:13px 18px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--red);outline-offset:3px}button:disabled{opacity:.45}#mute{background:transparent;color:var(--ink);border:1px solid var(--ink);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 0;font:13px sans-serif}.stats strong{font-size:22px;display:block;margin-top:5px}.progress{height:5px;background:#c9bd9f;margin-bottom:10px}.progress div{height:100%;width:0;background:var(--red)}.stage{position:relative}canvas{width:100%;height:430px;display:block;background:#c9ddd5;touch-action:none;border:1px solid #a89978}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f2e6c970;padding:20px}.card{max-width:410px;text-align:center;background:#f2e6c9f5;border:2px solid var(--ink);padding:26px;box-shadow:8px 8px 0 #183e4a30}.card h2{margin:0 0 12px;font-size:29px}.card p{line-height:1.8;font-size:15px}.card button{background:var(--red)}.controls{display:flex;gap:10px;margin-top:14px}.controls button{flex:1;user-select:none;-webkit-user-select:none;touch-action:none}#jump{background:var(--red);flex:1.6}#notice{min-height:26px;margin:12px 0 0;font-weight:bold;font-size:15px}.help{font:13px/1.8 sans-serif;opacity:.85}footer{border-top:1px solid #a89978;margin-top:16px;padding-top:12px;font:12px/1.7 sans-serif}[hidden]{display:none!important}@media(max-width:600px){main{padding:16px 12px}h1{font-size:37px}h1 small{display:block;font-size:12px;margin-top:4px}.stats{gap:6px;font-size:11px}.stats strong{font-size:18px}canvas{height:390px}.card{padding:18px}.card h2{font-size:24px}.controls button{padding:16px 7px;font-size:14px}.help{font-size:12px}}
</style>
<main>
<header><div><div class="eyebrow">街道を駆ける、小さな旅</div><h1>飛脚 <small>日本橋 → 品川 / 最小版</small></h1></div><button id="mute" aria-pressed="false">音：切</button></header>
<section class="stats" aria-label="配達状況"><div>品川まで<strong id="distance">6.0 km</strong></div><div>残り時間<strong id="timer">4:00</strong></div><div>スタミナ<strong id="stamina">100</strong></div><div>所持金<strong id="money">0 両</strong></div></section>
<div class="progress" aria-label="配達の進み具合"><div id="progress"></div></div>
<div class="stage"><canvas id="game" aria-label="横スクロールの飛脚ゲーム。右矢印で走り、スペースで障害物を跳び越えます。"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">一通の手紙を、品川へ。</h2><p id="description">街道を走り、旅人や荷車を跳び越えよう。<br>疲れたら立ち止まってひと休み。<br>制限時間は4分。無事の配達で10両。</p><button id="start">手紙を預かって出発</button></div></div></div>
<div class="controls"><button id="rest">休む / ←</button><button id="run">走る / →</button><button id="jump">跳ぶ / SPACE</button><button id="pause">一時停止</button></div>
<p id="notice" role="status" aria-live="polite">日本橋にて、出発の刻を待つ。</p>
<p class="help">PC：→を押して走る・←または離して休む・Space / ↑で跳ぶ。スマホ：道をタップして走行切替、上スワイプで跳ぶ。下のボタンでも操作できます。</p>
<footer>歴史再現ではなく、江戸の街道を題材にした創作です。絵・音はこのゲーム用の自作。通信・広告・課金なし。記録はこの端末のブラウザ内に保存されます。</footer>
</main>
<script>
'use strict';
// No dependencies, network requests or external assets. Tune these constants first.
const ROUTE=6000, LIMIT=240, SPEED=35, SAVE_KEY='hikyaku-mvp-v1';
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d');
let W=1000,H=430,dpr=1,mode='ready',x=0,time=LIMIT,energy=100,y=0,vy=0,hit=0,step=0,running=false,keys=new Set(),last=0;
let wallet=0,deliveries=0,saveOK=true;
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');wallet=Number.isFinite(s.wallet)?Math.max(0,Math.floor(s.wallet)):0;deliveries=Number.isFinite(s.deliveries)?Math.max(0,Math.floor(s.deliveries)):0;}catch{saveOK=false;}
let sound=false,audio=null,nextNote=0,noteIndex=0;
const obstacles=Array.from({length:28},(_,i)=>({x:360+i*194,type:i%4,done:false}));
function say(t){$('notice').textContent=t;}
function tone(freq,duration=.12,volume=.035){if(!sound||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}
$('mute').onclick=()=>{sound=!sound;if(sound){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();tone(440);}catch{sound=false;say('このブラウザでは音を再生できません。');}}$('mute').textContent='音：'+(sound?'入':'切');$('mute').setAttribute('aria-pressed',String(sound));};
function hud(){$('distance').textContent=((ROUTE-x)/1000).toFixed(1)+' km';$('timer').textContent=Math.floor(Math.ceil(time)/60)+':'+String(Math.ceil(time)%60).padStart(2,'0');$('stamina').textContent=Math.round(energy);$('money').textContent=wallet+' 両';$('progress').style.width=(x/ROUTE*100)+'%';}
function start(){document.activeElement.blur();x=0;time=LIMIT;energy=100;y=vy=hit=step=0;running=false;keys.clear();obstacles.forEach(o=>o.done=false);mode='play';$('overlay').hidden=true;$('pause').textContent='一時停止';say('手紙を預かった。右へ走って品川を目指そう。');hud();}
function jump(){if(mode==='play'&&y===0&&energy>=5){vy=330;energy-=5;tone(660);}}
function finish(won){mode='end';running=false;keys.clear();if(won){wallet+=10;deliveries++;try{localStorage.setItem(SAVE_KEY,JSON.stringify({wallet,deliveries}));}catch{saveOK=false;}tone(880,.5);}$('title').textContent=won?'品川へ、無事お届け！':'日が暮れる前に、もう一度。';$('description').textContent=won?'手紙を配達して10両獲得。配達回数：'+deliveries+'回。'+(saveOK?'記録を保存しました。':'保存できないため、記録は今回のみ有効です。'):'時間切れ。跳びすぎず、休みながら街道を進もう。';$('start').textContent='もう一度、日本橋から';$('overlay').hidden=false;say(won?'配達完了。おつかれさまでした。':'配達時間を過ぎました。');hud();}
function pause(){if(mode==='play'){mode='paused';running=false;keys.clear();$('pause').textContent='再開';say('一時停止中。再開ボタンで街道へ戻ります。');}else if(mode==='paused'){mode='play';$('pause').textContent='一時停止';say('配達を再開しました。');}}
$('start').onclick=start;$('pause').onclick=pause;$('jump').onpointerdown=e=>{e.preventDefault();jump();};
function hold(id,action){const b=$(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);action(true);};b.onpointerup=()=>action(false);b.onpointercancel=()=>action(false);b.onlostpointercapture=()=>action(false);}
hold('run',v=>{running=v;});hold('rest',v=>{if(v){running=false;keys.delete('ArrowRight');}});
addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','ArrowUp','Space'].includes(e.code)&&!['BUTTON','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();keys.add(e.code);if(!e.repeat&&(e.code==='Space'||e.code==='ArrowUp'))jump();}});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{if(mode==='play')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause();});
let touchY=0;canvas.onpointerdown=e=>{touchY=e.clientY;canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=e=>{if(mode!=='play')return;if(touchY-e.clientY>25)jump();else running=!running;};
function update(dt){if(mode!=='play')return;time=Math.max(0,time-dt);hit=Math.max(0,hit-dt);const move=(running||keys.has('ArrowRight'))&&!keys.has('ArrowLeft');if(move){const speed=SPEED*(energy<8?.55:1)*(hit>0?.4:1);x=Math.min(ROUTE,x+speed*dt);energy=Math.max(0,energy-dt*.32);step+=dt*9;}else energy=Math.min(100,energy+dt*12);if(y>0||vy>0){y+=vy*dt;vy-=850*dt;if(y<0){y=0;vy=0;}}for(const o of obstacles){if(!o.done&&x>=o.x){o.done=true;if(y<42){hit=1.4;energy=Math.max(0,energy-7);tone(110,.18);say(['荷車をよけて小休止。','旅人に道をゆずった。','水たまりで足がすべった。','犬の前で歩調をゆるめた。'][o.type]);}else{say('ひらりと越えて、先へ。');tone(520,.08);}}}if(x>=ROUTE)finish(true);else if(time<=0)finish(false);if(sound&&audio&&audio.currentTime>nextNote){const notes=[293.66,349.23,392,440,523.25,440,392,349.23];tone(notes[noteIndex++%notes.length],.28,.015);nextNote=audio.currentTime+.45;}hud();}
// Logical CSS-pixel canvas with a capped pixel ratio keeps mobile rendering light.
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function rect(a,b,c,d,color){ctx.fillStyle=color;ctx.fillRect(a,b,c,d);}function circle(a,b,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(a,b,r,0,Math.PI*2);ctx.fill();}
function draw(){ctx.clearRect(0,0,W,H);rect(0,0,W,H,'#cadbd1');circle(W*.78,65,33,'#c55d43');ctx.fillStyle='#f2e6c9';for(let i=0;i<5;i++){const cx=((i*260-x*.08)%(W+260)+W+260)%(W+260)-100;ctx.beginPath();ctx.ellipse(cx,85+i%2*25,62,9,0,0,7);ctx.fill();}ctx.fillStyle='#8daea9';ctx.beginPath();ctx.moveTo(0,H*.59);ctx.lineTo(W*.18,H*.31);ctx.lineTo(W*.32,H*.53);ctx.lineTo(W*.55,H*.28);ctx.lineTo(W*.86,H*.57);ctx.lineTo(W,H*.44);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();const ground=H-80;for(let i=0;i<8;i++){const bx=((i*170-x*.35)%(W+200)+W+200)%(W+200)-100;rect(bx,ground-95,95,95,'#d8c6a0');ctx.fillStyle='#274e55';ctx.beginPath();ctx.moveTo(bx-12,ground-95);ctx.lineTo(bx+45,ground-126);ctx.lineTo(bx+108,ground-95);ctx.fill();rect(bx+34,ground-54,25,54,'#62736a');}rect(0,ground,W,80,'#d6ba83');rect(0,ground,W,4,'#294b50');for(let i=0;i<18;i++)rect((i*91-x*2)% (W+100),ground+38,25,2,'#b39b70');const px=Math.min(100,W*.24);for(const o of obstacles){const ox=px+(o.x-x)*2;if(ox<-80||ox>W+90)continue;if(o.type===0){rect(ox-23,ground-36,46,25,'#8c6141');circle(ox-15,ground-7,10,'#283b3d');circle(ox+17,ground-7,10,'#283b3d');}else if(o.type===1){circle(ox,ground-53,9,'#bc8c63');rect(ox-10,ground-43,20,32,'#6b7371');rect(ox-9,ground-11,5,11,'#293f42');rect(ox+4,ground-11,5,11,'#293f42');}else if(o.type===2){ctx.fillStyle='#769ea5';ctx.beginPath();ctx.ellipse(ox,ground+4,28,6,0,0,7);ctx.fill();}else{rect(ox-18,ground-25,30,16,'#eee0b9');circle(ox+15,ground-26,10,'#eee0b9');rect(ox-15,ground-9,5,9,'#665740');rect(ox+6,ground-9,5,9,'#665740');}}ctx.save();ctx.translate(px,ground-y);if(hit>0)ctx.globalAlpha=.65;circle(0,-60,10,'#b7865a');rect(-12,-53,23,29,'#234f61');rect(-24,-49,15,22,'#bb4734');rect(-22,-46,11,2,'#f2e6c9');rect(-12,-69,26,4,'#f2e6c9');ctx.strokeStyle='#253d42';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-5,-25);ctx.lineTo(-8+Math.sin(step)*9,-5);ctx.moveTo(5,-25);ctx.lineTo(8-Math.sin(step)*9,-5);ctx.stroke();ctx.strokeStyle='#b7865a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(8,-48);ctx.lineTo(19,-35);ctx.stroke();ctx.restore();rect(W-104,17,89,31,'#f2e6c9');ctx.fillStyle='#234653';ctx.font='14px serif';ctx.fillText(x<100?'日本橋 出立':x>5700?'品川 まもなく':'東海道 / 晴れ',W-98,38);if(mode==='paused'){rect(0,H/2-30,W,60,'#f2e6c9e6');ctx.textAlign='center';ctx.font='22px serif';ctx.fillStyle='#183e4a';ctx.fillText('ひと休み — 一時停止',W/2,H/2+7);ctx.textAlign='start';}}
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();requestAnimationFrame(frame);}addEventListener('resize',resize);resize();hud();requestAnimationFrame(frame);
</script>
</html>
